---
apiVersion: v1
kind: Namespace
metadata:
  name: moone

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demoapp
  namespace: moone
  labels:
    app: demoapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: demoapp
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: demoapp
    spec:
      containers:
      - name: demoapp
        image: registry.cn-guangzhou.aliyuncs.com/kansctl/demoapp:v1.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http-web
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  name: demoapp-svc
  namespace: moone
spec:
  type: NodePort
  selector:
    app: demoapp
  ports:
  - port: 80
    targetPort: http-web
    protocol: TCP
