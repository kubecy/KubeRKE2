####################################################################################
## 操作系统通用的基础配置                                                        ###
####################################################################################

---
- name: 禁用系统 swap
  shell: "source /etc/profile; swapoff -a && sysctl -w vm.swappiness=0"
  ignore_errors: true

- name: 删除 fstab swap 相关配置
  lineinfile:
    path: /etc/fstab
    regexp: 'swap'
    state: absent
    backup: 'yes'

- name: 加载内核模块
  modprobe: name={{ item }} state=present
  with_items:
    - br_netfilter
    - dm_snapshot
    - dm_thin_pool
    - ip_vs
    - ip_vs_rr
    - ip_vs_wrr
    - ip_vs_sh
    - nf_conntrack
  ignore_errors: true

- name: 尝试加载 nf_conntrack_ipv4
  shell: 'modprobe nf_conntrack_ipv4 || echo "NoFound"'
  register: NF_CONNTRACK_IPV4

- name: 启用 systemd 自动加载模块服务
  service: name=systemd-modules-load enabled=yes

- name: 增加内核模块开机加载配置
  template: src=10-k8s-rke2-modules.conf.j2 dest=/etc/modules-load.d/10-k8s-rke2-modules.conf

- name: 设置系统内核参数
  template: src=95-k8s-rke2-sysctl.conf.j2 dest=/etc/sysctl.d/95-k8s-rke2-sysctl.conf

- name: 设置系统描述符 ulimits
  template: src=30-k8s-rke2-ulimits.conf.j2 dest=/etc/security/limits.d/30-k8s-rke2-ulimits.conf

- name: 查看是否需要设置 fs.may_detach_mounts
  stat:
    path: /proc/sys/fs/may_detach_mounts
    get_attributes: no
    get_checksum: no
    get_mime: no
  register: fs_may_detach_mounts
  ignore_errors: true

- name: 生效系统参数
  shell: "source /etc/profile; sysctl -p /etc/sysctl.d/95-k8s-rke2-sysctl.conf"
  ignore_errors: true

- name: 把SCTP列入内核模块黑名单
  copy: src=sctp.conf dest=/etc/modprobe.d/sctp.conf

####################################################################################
## RKE2 基础配置信息                                                             ###
####################################################################################
- name: 创建 {{ global.k8s_user.group }} 组
  group:
    name: "{{ global.k8s_user.group }}"
    gid: "{{ global.k8s_user.gid }}"
    state: present

- name: 创建 {{ global.k8s_user.user }} 用户, 管理 K8S 集群专用用户
  user:
    name: "{{ global.k8s_user.user }}"
    uid: "{{ global.k8s_user.uid }}"
    group: "{{ global.k8s_user.group }}"
    state: present
    shell: /bin/bash
    home: /home/{{ global.k8s_user.user }}
    password: "{{ global.k8s_user.password | password_hash('sha512') }}"

- name: 创建 RKE2 程序, 工作, 数据目录
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  with_items:
    - "{{ global.software_dir }}"
    - "{{ global.rke2_worker_dir }}"
    - "{{ global.rke2_data_dir }}"

- name: 为 {{ global.k8s_user.user }} 用户配置 sudo 免密（NOPASSWD）
  lineinfile:
    path: /etc/sudoers.d/{{ global.k8s_user.user }}
    line: "{{ global.k8s_user.user }}   ALL=(ALL)   NOPASSWD: ALL"
    create: yes
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"

- name: 配置 sudo secure_path 追加 RKE2 bin 目录
  lineinfile:
    path: /etc/sudoers.d/{{ global.k8s_user.user }}
    line: "Defaults   secure_path = /sbin:/bin:/usr/sbin:/usr/bin:{{ global.rke2_data_dir }}/bin"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"

- name: 配置 RKE2 私有镜像仓库
  template: src=96-k8s-rke2-registries.yml.j2 dest={{ global.rke2_worker_dir }}/registries.yaml

#- name: 配置 RKE2 SERVER 配置文件
#  template: src=97-k8s-rke2-server-config.yml.j2 dest={{ global.rke2_worker_dir }}/config.yaml

- name: 配置 crictl 的连接配置文件
  template: src=98-k8s-rke2-crictl.yml.j2 dest=/etc/crictl.yaml

- name: 同步 RKE2 二进制包, 镜像清单文件, 校验文件, 安装脚本
  copy:
    src: "{{ global.ansible_dir }}/rke2_packages/"
    dest: "{{ global.software_dir }}"
    mode: preserve
