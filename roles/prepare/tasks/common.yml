####################################################################################
## 操作系统通用的基础配置                                                        ###
####################################################################################
---
- name: 检测主机 CGroup 版本 (cgroup v2 = cgroup2fs, v1 = tmpfs)
  shell: "stat -fc %T /sys/fs/cgroup/"
  register: host_cgroup_type
  when: (rke2_version.split('+')[0].split('.')[1] | int) >= 35

- name: 校验 K8S >= v1.35 要求 CGroup 必须为 cgroup2fs
  fail:
    msg: "主机 {{ inventory_hostname }} 当前 CGroup 版本为 {{ host_cgroup_type.stdout }} (cgroup v1)，RKE2 {{ rke2_version }} (>= v1.35) 要求 cgroup v2 (cgroup2fs)，请升级内核并启用 cgroup v2 后重新部署"
  when:
    - (rke2_version.split('+')[0].split('.')[1] | int) >= 35
    - host_cgroup_type.stdout != "cgroup2fs"

- name: 禁用系统 swap
  shell: "source /etc/profile; swapoff -a && sysctl -w vm.swappiness=0"
  ignore_errors: true

- name: 删除 fstab swap 相关配置
  lineinfile:
    path: /etc/fstab
    regexp: 'swap'
    state: absent
    backup: 'yes'

- name: 加载内核模块
  modprobe: name={{ item }} state=present
  with_items:
    - br_netfilter
    - dm_snapshot
    - dm_thin_pool
    - ip_vs
    - ip_vs_rr
    - ip_vs_wrr
    - ip_vs_sh
    - nf_conntrack
  ignore_errors: true

- name: 尝试加载 nf_conntrack_ipv4
  shell: 'modprobe nf_conntrack_ipv4 || echo "NoFound"'
  register: NF_CONNTRACK_IPV4

- name: 启用 systemd 自动加载模块服务
  service: name=systemd-modules-load enabled=yes

- name: 增加内核模块开机加载配置
  template: src=10-k8s-rke2-modules.conf.j2 dest=/etc/modules-load.d/10-k8s-rke2-modules.conf

- name: 设置系统内核参数
  template: src=95-k8s-rke2-sysctl.conf.j2 dest=/etc/sysctl.d/95-k8s-rke2-sysctl.conf

- name: 设置系统描述符 ulimits
  template: src=30-k8s-rke2-ulimits.conf.j2 dest=/etc/security/limits.d/30-k8s-rke2-ulimits.conf

- name: 查看是否需要设置 fs.may_detach_mounts
  stat:
    path: /proc/sys/fs/may_detach_mounts
    get_attributes: no
    get_checksum: no
    get_mime: no
  register: fs_may_detach_mounts
  ignore_errors: true

- name: 生效系统参数
  shell: "source /etc/profile; sysctl -p /etc/sysctl.d/95-k8s-rke2-sysctl.conf"
  ignore_errors: true

- name: 把SCTP列入内核模块黑名单
  copy: src=sctp.conf dest=/etc/modprobe.d/sctp.conf

####################################################################################
## 磁盘分区与挂载                                                                ###
####################################################################################
- name: "磁盘分区与挂载 (global.partition: yes 时生效)"
  block:
    - name: 安装文件系统与 LVM 工具 (xfsprogs, lvm2)
      package:
        name:
          - xfsprogs
          - lvm2
        state: present

    - name: 组装磁盘挂载配置
      set_fact:
        disk_mount_configs: "{{ disk_mount_configs | default([]) + [item] }}"
      loop:
        - device: "/dev/{{ global.partition.rke2_data_dir_disk | default('') }}"
          mount: "{{ global.rke2_data_dir }}"
          vg: vg_rke2
          lv: lv_rke2
        - device: "/dev/{{ global.partition.kubelet_dir_disk | default('') }}"
          mount: "{{ global.kubelet_dir }}"
          vg: vg_kubelet
          lv: lv_kubelet
        - device: "/dev/{{ global.partition.etcd_dir_disk | default('') }}"
          mount: "{{ global.rke2_data_dir }}/server/db/etcd"
          vg: vg_etcd
          lv: lv_etcd
          server_only: true                     ## etcd 仅 rke2-server (master) 节点挂载
      when:
        - item.device not in ['/dev/']
        - item.device != '/dev/none'
        - not (item.server_only | default(false) and 'rke2_server' not in group_names)
      loop_control:
        label: "{{ item.device }}"

    - name: 检测并校验定义挂载盘是否存在
      shell: |
        if [ ! -e {{ item.device | quote }} ]; then
          printf ' 主机未检测到磁盘, 检查硬件或在 site.yml 中修改 global.partition.{rke2_data_dir_disk,kubelet_dir_disk,etcd_dir_disk}' {{ inventory_hostname | quote }} {{ item.device | quote }}
          exit 1
        fi
      loop: "{{ disk_mount_configs }}"
      changed_when: false
      loop_control:
        label: "{{ item.device }}"

    - name: 检测磁盘是否挂载
      shell: |
        result=$(lsblk -rno FSTYPE,MOUNTPOINT {{ item.device | quote }} | sed '/^[[:space:]]*$/d')
        if [ -n "${result}" ]; then
          printf '主机磁盘挂载已使用, 拒绝格式化, 先卸载并确认无业务数据后重试' {{ inventory_hostname | quote }} {{ item.device | quote }} "${result}"
          exit 1
        fi
      loop: "{{ disk_mount_configs }}"
      changed_when: false
      loop_control:
        label: "{{ item.device }}"

    - name: 创建挂载点目录
      file:
        path: "{{ item.mount }}"
        state: directory
        mode: '0755'
      loop: "{{ disk_mount_configs }}"
      loop_control:
        label: "{{ item.mount }}"

    - name: 创建物理卷与卷组 (LVM, 整盘直接使用)
      lvg:
        vg: "{{ item.vg }}"
        pvs: "{{ item.device }}"
      loop: "{{ disk_mount_configs }}"
      loop_control:
        label: "{{ item.device }}"

    - name: 创建逻辑卷
      lvol:
        vg: "{{ item.vg }}"
        lv: "{{ item.lv }}"
        size: 100%FREE
      loop: "{{ disk_mount_configs }}"
      loop_control:
        label: "{{ item.device }}"

    - name: 格式化逻辑卷为 {{ global.partition.format_type | default('xfs') }}
      filesystem:
        fstype: "{{ global.partition.format_type | default('xfs') }}"
        dev: "/dev/{{ item.vg }}/{{ item.lv }}"
      loop: "{{ disk_mount_configs }}"
      loop_control:
        label: "{{ item.device }}"

    - name: 获取逻辑卷 UUID
      shell: "blkid -s UUID -o value /dev/{{ item.vg }}/{{ item.lv }}"
      register: disk_part_uuid
      loop: "{{ disk_mount_configs }}"
      loop_control:
        label: "{{ item.device }}"

    - name: 挂载到目标目录并写入 fstab
      mount:
        path: "{{ item.item.mount }}"
        src: "UUID={{ item.stdout }}"
        fstype: "{{ global.partition.format_type | default('xfs') }}"
        state: mounted
        backup: yes
      loop: "{{ disk_part_uuid.results }}"
      loop_control:
        label: "{{ item.item.device }}"
  when: global.partition.enabled | default("no") | bool

####################################################################################
## RKE2 基础配置信息                                                             ###
####################################################################################
- name: 创建 {{ global.k8s_user.group }} 组
  group:
    name: "{{ global.k8s_user.group }}"
    gid: "{{ global.k8s_user.gid }}"
    state: present

- name: 创建 {{ global.k8s_user.user }} 用户, 管理 K8S 集群专用用户
  user:
    name: "{{ global.k8s_user.user }}"
    uid: "{{ global.k8s_user.uid }}"
    group: "{{ global.k8s_user.group }}"
    state: present
    shell: /bin/bash
    home: /home/{{ global.k8s_user.user }}
    password: "{{ global.k8s_user.password | password_hash('sha512') }}"

- name: 创建 RKE2 程序, 工作, 数据目录
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  with_items:
    - "{{ global.software_dir }}"
    - "{{ global.rke2_worker_dir }}"
    - "{{ global.rke2_data_dir }}"

- name: 为 {{ global.k8s_user.user }} 用户配置 sudo 免密（NOPASSWD）
  lineinfile:
    path: /etc/sudoers.d/{{ global.k8s_user.user }}
    line: "{{ global.k8s_user.user }}   ALL=(ALL)   NOPASSWD: ALL"
    create: yes
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"

- name: 配置 sudo secure_path 追加 RKE2 bin 目录
  lineinfile:
    path: /etc/sudoers.d/{{ global.k8s_user.user }}
    line: "Defaults   secure_path = /sbin:/bin:/usr/sbin:/usr/bin:{{ global.rke2_data_dir }}/bin"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"

- name: 配置 RKE2 私有镜像仓库
  template: src=96-k8s-rke2-registries.yml.j2 dest={{ global.rke2_worker_dir }}/registries.yaml

- name: 配置 crictl 的连接配置文件
  template: src=98-k8s-rke2-crictl.yml.j2 dest=/etc/crictl.yaml

- name: 计算 RKE2 二进制架构后缀 (amd -> amd64, arm -> arm64)
  set_fact:
    rke2_arch_suffix: "{{ 'amd64' if (arch | lower) == 'amd' else ('arm64' if (arch | lower) == 'arm' else (arch | lower)) }}"

- name: 校验离线包目录包含 {{ rke2_arch_suffix }} 架构的二进制包
  stat:
    path: "{{ global.ansible_dir }}/{{ global.pkg_rke2 }}/{{ env_dir | basename }}/{{ rke2_version }}/{{ rke2_arch_suffix }}/rke2.linux-{{ rke2_arch_suffix }}.tar.gz"
  register: rke2_arch_pkg
  delegate_to: localhost
  run_once: true

- name: 缺少对应架构的 RKE2 离线包
  fail:
    msg: "缺少 {{ global.pkg_rke2 }}/{{ env_dir | basename }}/{{ rke2_version }}/{{ rke2_arch_suffix }}/ 下 {{ arch }} 架构的 rke2.linux-{{ rke2_arch_suffix }}.tar.gz, 请先执行 ./rke2ctl download {{ env_dir | basename }}"
  when: not rke2_arch_pkg.stat.exists

- name: 同步 RKE2 安装脚本, 二进制包, 镜像清单文件, 校验文件
  copy:
    src: "{{ global.ansible_dir }}/{{ global.pkg_rke2 }}/{{ env_dir | basename }}/{{ rke2_version }}/{{ rke2_arch_suffix }}/{{ item }}"
    dest: "{{ global.software_dir }}/"
    mode: preserve
  with_items:
    - install.sh
    - rke2-images-all.linux-amd64.txt
    - rke2.linux-amd64.tar.gz
    - sha256sum-amd64.txt
