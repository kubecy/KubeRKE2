####################################################################################
## redhat、centos、openeuler、rocky 系统配置                                     ###
####################################################################################

---
- name: 获取 SELinux 运行模式
  shell: getenforce
  register: selinux_status
  changed_when: false
  check_mode: no

- name: 临时关闭 SELinux
  shell: setenforce 0
  when: selinux_status.stdout == "Enforcing"

- name: 永久关闭 SELinux
  lineinfile:
    path: /etc/selinux/config
    regexp: '^SELINUX='
    line: 'SELINUX=disabled'
    state: present

- name: 关闭防火墙
  systemd:
    name: "{{ item }}"
    state: stopped
    enabled: no
  with_items:
    - firewalld
  failed_when: false

- name: 检查 dnf 可执行文件是否存在
  command: 'command -v dnf'
  register: dnf_check
  ignore_errors: yes
  changed_when: false

- name: dnf 删除 centos、redhat 默认安装
  dnf:
    name:
      - firewalld
      - python-firewall
      - firewalld-filesystem
    state: absent
  ignore_errors: true
  when: dnf_check.rc == 0

- name: 删除 centos、redhat 默认安装
  package:
    name:
      - firewalld
      - python-firewall
      - firewalld-filesystem
    state: absent
  ignore_errors: true
  when: dnf_check.rc != 0

- name: dnf 安装基础软件包
  dnf:
    name:
      - bash-completion
      - conntrack-tools
      - ipset
      - ipvsadm
      - libseccomp
      - lvm2
      - nfs-utils
      - psmisc
      - rsync
      - socat
      - ebtables
      - bridge-utils
      - rsyslog
      - iproute-tc
    state: present
  when:
    - dnf_check.rc == 0
    - global.install_source | default("online") != "offline"

- name: 安装基础软件包
  package:
    name:
      - bash-completion
      - conntrack-tools
      - ipset
      - ipvsadm
      - libseccomp
      - lvm2
      - nfs-utils
      - psmisc
      - rsync
      - socat
      - ebtables
      - bridge-utils
      - rsyslog
      - iproute-tc
    state: present
  when:
    - dnf_check.rc != 0
    - global.install_source | default("online") != "offline"

- import_tasks: offline.yml
  when: global.install_source | default("online") != "offline"

- name: 禁止 rsyslog 获取 journald 日志1
  lineinfile:
    dest: /etc/rsyslog.conf
    state: present
    regexp: 'ModLoad imjournal'
    line: '#$ModLoad imjournal # provides access to the systemd journal'
  ignore_errors: true

- name: 禁止 rsyslog 获取 journald 日志2
  lineinfile:
    dest: /etc/rsyslog.conf
    state: present
    regexp: 'IMJournalStateFile'
    line: '#$IMJournalStateFile imjournal.state'
  ignore_errors: true

- name: 重启 rsyslog 服务
  service: name=rsyslog state=restarted
  ignore_errors: true
