---
- name: 创建 {{ rke2_server.db.group }} 组
  group:
    name: "{{ rke2_server.db.group }}"
    gid: "{{ rke2_server.db.gid }}"
    system: yes

- name: 创建 {{ rke2_server.db.user }} 用户
  user:
    name: "{{ rke2_server.db.user }}"
    uid: "{{ rke2_server.db.uid }}"
    group: "{{ rke2_server.db.group }}"
    system: yes
    shell: /sbin/nologin
    create_home: no

- name: 配置 RKE2 SERVER 配置文件
  template: src=91-k8s-rke2-server-config.yml.j2 dest={{ global.rke2_worker_dir }}/config.yaml

- name: 部署 RKE2 SERVER 程序
  shell: INSTALL_RKE2_TYPE=server INSTALL_RKE2_VERSION={{ rke2_version }} INSTALL_RKE2_ARTIFACT_PATH={{ global.software_dir }} sh {{ global.software_dir }}/install.sh

- name: 校验 kube-vip 配置完整
  fail:
    msg: "rke2_server.kube_vip.enabled 为 yes, 但 kube_vip_version / kube_vip_interface / virtual_ip 缺失或非法, 请检查 site.yml"
  when:
    - rke2_server.kube_vip.enabled | default("no") | bool
    - (rke2_server.kube_vip.kube_vip_version is not defined or rke2_server.kube_vip.kube_vip_version | length == 0
       or rke2_server.kube_vip.kube_vip_interface is not defined or rke2_server.kube_vip.kube_vip_interface | length == 0
       or rke2_server.kube_vip.virtual_ip is not defined or rke2_server.kube_vip.virtual_ip | length == 0
       or rke2_server.kube_vip.virtual_ip is not match '^[0-9]{1,3}(\.[0-9]{1,3}){3}$')

- name: 创建 RKE2 Server manifests 目录
  file:
    path: "{{ global.rke2_data_dir }}/server/manifests"
    state: directory
    mode: '0755'
  when: rke2_server.kube_vip.enabled | default("no") | bool or rke2_server.kubeproxyreplacement | default(false) | bool


- name: 部署 rke2-cilium HelmChartConfig 的清单文件
  template:
    src: 93-rke2-cilium-config.yaml.j2
    dest: "{{ global.rke2_data_dir }}/server/manifests/93-rke2-cilium-config.yaml"
  when:
    - rke2_server.disable_kube_proxy | default(false) | bool 
    - rke2_server.kubeproxyreplacement | default(false) | bool

- name: 部署 rke2‑coredns 配置 HelmChartConfig 清单
  template:
    src: 94-rke2-coredns-config.yaml.j2
    dest: "{{ global.rke2_data_dir }}/server/manifests/94-rke2-coredns-config.yaml"

- name: 部署 rke2‑traefik 配置 HelmChartConfig 清单
  template:
    src: 95-rke2-traefik-config.yaml.j2
    dest: "{{ global.rke2_data_dir }}/server/manifests/95-rke2-traefik-config.yaml"
  when: rke2_server.ingress_controller == "traefik" 

- name: 部署 kube-vip 控制面 HA 清单
  template:
    src: 92-kube-vip.yaml.j2
    dest: "{{ global.rke2_data_dir }}/server/manifests/92-kube-vip.yaml"
  when: rke2_server.kube_vip.enabled | default("no") | bool

- name: 启动 RKE2 SERVER 初始化节点【首个 MASTER】
  systemd:
    name: rke2-server
    state: restarted
    enabled: yes
  when: init_master | default(false) | bool

- name: 获取集群初始化 RKE2 SERVER 节点
  set_fact:
    first_master_node: "{{ item }}"
  with_items: "{{ groups.rke2_server }}"
  when:
    - hostvars[item].init_master is defined
    - hostvars[item].init_master | bool
  run_once: true

- name: 等待 RKE2 SERVER 初始化, 启动 APIServer服务
  wait_for:
    host: "{{ hostvars[first_master_node].ansible_host }}"
    port: 6443
    timeout: 120
    delay: 5
  run_once: true
#  delegate_to: localhost

- name: 等待 kube-vip 在首个 MASTER 接管 VIP 地址
  shell: ip -4 addr show | grep -qw "{{ rke2_server.kube_vip.virtual_ip }}"
  register: vip_check
  until: vip_check.rc == 0
  retries: 90
  delay: 5
  changed_when: false
  delegate_to: "{{ first_master_node }}"
  run_once: true
  when: rke2_server.kube_vip.enabled | default("no") | bool

- name: 检查是否安装 CNI 插件
  stat:
    path: /opt/cni
  register: cni_dir

- name: 修改 /opt/cni 权限
  file:
    path: /opt/cni
    owner: root
    group: root
    recurse: true
  when: cni_dir.stat.exists

- name: 启动额外的 RKE2 SERVER 服务
  systemd:
    name: rke2-server
    state: restarted
    enabled: yes
  when: not init_master | default(false) | bool
