## ============================================================
## inventory/sample - secrets 模板 (明文模板, 未加密)
## 新增环境流程:
##   1. cp -r inventory/sample inventory/<新环境名>
##   2. 修改 hosts / site.yml
##   3. 加密本文件:  ansible-vault encrypt inventory/<新环境名>/secrets.yml
##   4. 填写各主机 sudo 密码: ansible-vault edit inventory/<新环境名>/secrets.yml
## 密码需 base64 编码: echo "你的密码" | base64
## 注意: servers 的键名必须与 hosts 中的主机名完全一致!
## ============================================================
servers: {}
#  示例:
#  servers:
#    <主机名>:
#      sudopass: "base64编码后的sudo密码=="
