## inventory/sample - secrets 模板 (明文模板, 未加密)                               ## 
##   1. 加密本文件  ansible-vault encrypt inventory/<新环境名>/secrets.yml          ## 
##   2. 填写各主机  sudo 密码: ansible-vault edit inventory/<新环境名>/secrets.yml  ##
##   3. 密码需 base64 编码: echo "你的密码" | base64                                ##
##   4. 注意: servers 的键名必须与 hosts 中的主机名完全一致!                        ##
## ===================================================================================
